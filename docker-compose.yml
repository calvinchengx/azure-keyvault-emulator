# The emulator family. entra-emulator issues the tokens; the keyvault and
# fabric emulators validate them against entra's JWKS — the same trust
# relationships as production Azure. Bring up the pair (entra + keyvault) or
# the full trio (add fabric) and run e2e/chain/run.sh's flow against the
# published ports.
#
# This file is deliberately self-contained: it pulls only images this repo and
# entra publish, so `make up` never waits on another repo's release. ARM is a
# separate overlay (docker-compose.arm.yml) for exactly that reason.
services:
  entra-emulator:
    image: ghcr.io/calvinchengx/entra-emulator:latest
    environment:
      ORIGIN_MODE: compat
      PUBLIC_ORIGIN: "https://entra-emulator:8443"
    ports:
      # Overridable so the stack can coexist with anything already on the
      # default port: ENTRA_PORT=18443 docker compose up.
      - "${ENTRA_PORT:-8443}:8443"
    healthcheck:
      test: ["CMD", "/usr/local/bin/entra-emulator", "healthcheck"]
      interval: 5s
      timeout: 2s
      retries: 10

  keyvault-emulator:
    image: ghcr.io/calvinchengx/azure-keyvault-emulator:latest
    depends_on:
      entra-emulator:
        condition: service_healthy
    ports:
      - "${KV_PORT:-8444}:8444"
    environment:
      # The authority the 401 challenge advertises, and the issuer/JWKS tokens
      # are validated against. 11111111-… is entra's seeded tenant.
      # https://vault.azure.net is a well-known Azure resource in
      # entra-emulator v0.2.1+, so client credentials resolve the vault
      # audience with no resource-app seed step.
      KV_ENTRA_ISSUER: "https://entra-emulator:8443/11111111-1111-1111-1111-111111111111/v2.0"
      KV_ENTRA_TLS_INSECURE: "true"
      # Authorization is this emulator's own /_emulator control surface. To
      # have ARM govern it instead — role assignments and the vault resource's
      # configuration, as in Azure — add the overlay:
      #   docker compose -f docker-compose.yml -f docker-compose.arm.yml up
      # or `make up ARM=1`.
      # The image bakes KV_DATA_DIR=/data for callers who mount a volume there.
      # This file mounts none, so leaving it set would write the SQLite DB and
      # TLS cert to an anonymous volume that outlives `docker compose down`.
      # Empty means run in-memory — no volume, no leftovers — which is what a
      # throwaway pair wants. To persist instead, drop this line and add:
      #   volumes: ["kv-data:/data"]      (plus a top-level `volumes: kv-data:`)
      KV_DATA_DIR: ""

  # The third member — enables the secret-as-SP-credential chain across all
  # three (see e2e/chain). Start it with `docker compose --profile full up`.
  fabric-emulator:
    image: ghcr.io/calvinchengx/fabric-emulator:latest
    profiles: [full]
    depends_on:
      entra-emulator:
        condition: service_healthy
    ports:
      - "9443:9443"
    environment:
      FABRIC_ENTRA_ISSUER: "https://entra-emulator:8443/11111111-1111-1111-1111-111111111111/v2.0"
      FABRIC_ENTRA_TLS_INSECURE: "true"
