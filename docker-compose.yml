# The emulator family. entra-emulator issues the tokens; the keyvault and
# fabric emulators validate them against entra's JWKS — the same trust
# relationships as production Azure. Bring up the pair (entra + keyvault) or
# the full trio (add fabric) and run e2e/chain/run.sh's flow against the
# published ports.
services:
  entra-emulator:
    image: ghcr.io/calvinchengx/entra-emulator:latest
    environment:
      ORIGIN_MODE: compat
      PUBLIC_ORIGIN: "https://entra-emulator:8443"
    ports:
      - "8443:8443"
    healthcheck:
      test: ["CMD", "/usr/local/bin/entra-emulator", "healthcheck"]
      interval: 5s
      timeout: 2s
      retries: 10

  # The management plane: role assignments and the vault resource live here,
  # exactly as they do in Azure. With it running, `az role assignment create`
  # and `az keyvault set-policy` govern the vault below.
  arm-emulator:
    image: ghcr.io/calvinchengx/arm-emulator:latest
    depends_on:
      entra-emulator:
        condition: service_healthy
    ports:
      - "${ARM_PORT:-8445}:8445"
    environment:
      ARM_ENTRA_ISSUER: "https://entra-emulator:8443/11111111-1111-1111-1111-111111111111/v2.0"
      ARM_ENTRA_TLS_INSECURE: "true"
      ARM_TENANT_ID: "11111111-1111-1111-1111-111111111111"
      ARM_DATA_DIR: ""
    healthcheck:
      test: ["CMD", "/usr/local/bin/arm-emulator", "healthcheck"]
      interval: 5s
      timeout: 2s
      retries: 10

  keyvault-emulator:
    image: ghcr.io/calvinchengx/azure-keyvault-emulator:latest
    depends_on:
      entra-emulator:
        condition: service_healthy
      arm-emulator:
        condition: service_healthy
    ports:
      - "8444:8444"
    environment:
      # The authority the 401 challenge advertises, and the issuer/JWKS tokens
      # are validated against. 11111111-… is entra's seeded tenant.
      # https://vault.azure.net is a well-known Azure resource in
      # entra-emulator v0.2.1+, so client credentials resolve the vault
      # audience with no resource-app seed step.
      KV_ENTRA_ISSUER: "https://entra-emulator:8443/11111111-1111-1111-1111-111111111111/v2.0"
      KV_ENTRA_TLS_INSECURE: "true"
      # Authorization comes from ARM: role assignments and the vault
      # resource's own configuration (access policies, RBAC mode, purge
      # protection, the soft-delete window). Drop these two to fall back to
      # the /_emulator control surface instead.
      KV_ARM_URL: "https://arm-emulator:8445"
      KV_ARM_RESOURCE_GROUP: "emulator-rg"
      # The image bakes KV_DATA_DIR=/data for callers who mount a volume there.
      # This file mounts none, so leaving it set makes SQLite fail to open its
      # file and the container exits 1 with "unable to open database file (14)"
      # — before serving anything. Empty means run in-memory, which is what a
      # throwaway pair wants. To persist instead, drop this line and add:
      #   volumes: ["kv-data:/data"]      (plus a top-level `volumes: kv-data:`)
      KV_DATA_DIR: ""

  # The third member — enables the secret-as-SP-credential chain across all
  # three (see e2e/chain). Start it with `docker compose --profile full up`.
  fabric-emulator:
    image: ghcr.io/calvinchengx/fabric-emulator:latest
    profiles: [full]
    depends_on:
      entra-emulator:
        condition: service_healthy
    ports:
      - "9443:9443"
    environment:
      FABRIC_ENTRA_ISSUER: "https://entra-emulator:8443/11111111-1111-1111-1111-111111111111/v2.0"
      FABRIC_ENTRA_TLS_INSECURE: "true"
