name: Make targets

# The Makefile is the documented entry point: the README and
# docs/14-platform-setup.md both tell users to run `make doctor` / `make up` /
# `make status`, so it needs the same cross-OS guarantee the Go tests have.
# Nothing else in CI ran a single `make` command before this workflow existed.
#
# The failures this catches are platform-specific and invisible on Linux, which
# is exactly why they survive:
#   * a shell script checked out with CRLF fails at the shebang: `sh` reads the
#     trailing \r as part of the interpreter path (.gitattributes pins eol=lf;
#     `sh -n` below is what proves it stayed pinned).
#   * on Windows `python3` is a Microsoft Store alias stub: on PATH, so every
#     `command -v python3` check passes, and it exits 49 when actually run.
#   * GNU Make falls back to cmd.exe when it cannot find a shell on PATH, and
#     every recipe here is POSIX shell.
#   * an unquoted or wrongly-named variable expands to nothing, or to whatever
#     the caller happened to export; `make -n` catches that without running it.
#
# Docker coverage is Linux-only by necessity, not by choice: GitHub's macOS
# runners have no Docker daemon, and the Windows runners support only Windows
# containers, so the Linux images this stack is built from cannot run there. On
# those two the container targets are checked for correct EXPANSION rather than
# execution, which still catches the variable and quoting classes of bug.

on:
  workflow_call: # called by release.yml as a release gate
  push:
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # THE DOCS LANE, ON PULL REQUESTS ONLY. Jobs that cannot observe a markdown
  # file are gated on `docs_only != 'true'`; the jobs that READ the docs are
  # not, because they must run on exactly those changes. A push to main always
  # runs everything, whatever it touched -- see the classify step below.
  # See scripts/docs_only_change.py.
  #
  # Ported from fabric-emulator, which worked this out first.
  changes:
    name: Is this change documentation only?
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      docs_only: ${{ steps.classify.outputs.docs_only }}
    steps:
      # Full history: the classifier diffs against the base, which a depth-1
      # checkout cannot see.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # Beside the real classification, every time. A classifier that stopped
      # matching would answer `false` forever: safe, plausible, and silently
      # useless. The cases are the only thing that would notice.
      - run: python3 scripts/docs_only_change.py --self-test
      - id: classify
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          # A force push and a branch's first commit both give the null sha.
          # Neither is a docs change; both run everything.
          # THE LANE IS FOR PULL REQUESTS. Every commit on main gets the full
          # matrix, whatever it touched; the reasoning is at the same step in
          # ci.yml.
          if [ "${GITHUB_EVENT_NAME}" != "pull_request" ]; then
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            echo "event is ${GITHUB_EVENT_NAME}, not a pull request: every commit on main gets the full matrix"
            exit 0
          fi
          if ! git rev-parse -q --verify "$BASE^{commit}" >/dev/null; then
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            echo "base '$BASE' is not a commit here; running everything"
            exit 0
          fi
          git diff --name-status "$BASE...$HEAD_SHA" | python3 scripts/docs_only_change.py

  make-targets:
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    name: make targets (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      # macOS ships GNU Make 3.81 with the Xcode CLT and Linux ships it as
      # standard; only Windows needs one installed. Same story
      # docs/14-platform-setup.md tells users, via the package manager already
      # present on the runner.
      - name: Install GNU Make (Windows only)
        if: runner.os == 'Windows'
        run: choco install make --no-progress -y

      # Deliberately the runner's DEFAULT shell, PowerShell on Windows. This is
      # the one step that reproduces how a Windows user actually invokes make,
      # and it fails if Make cannot find sh.exe or the grep/awk the recipe uses.
      # One command per step so its exit code is the step's exit code: under
      # pwsh only the LAST command's status is checked.
      - name: make help (from the platform's native shell)
        run: make help

      - name: Makefile and scripts are POSIX-clean
        shell: bash
        run: |
          set -euo pipefail
          # Syntax-only, with the interpreter each script's shebang actually
          # declares: `sh -n` on a #!/usr/bin/env bash script would reject
          # legitimate bashisms, and `bash -n` on a #!/bin/sh script would let
          # real ones through. This is what catches a CRLF checkout (dash and
          # bash both reject a brace followed by a carriage return) and
          # any bashism creeping into an sh script.
          for f in scripts/*.sh; do
            case "$(head -1 "$f")" in
              *bash) echo "bash -n $f"; bash -n "$f" ;;
              *)     echo "sh -n   $f"; sh -n "$f" ;;
            esac
          done

      - name: Every target expands
        shell: bash
        run: |
          set -euo pipefail
          # -n prints the recipe without running it, so this exercises variable
          # expansion, quoting and the shell selection on every platform,
          # including the docker targets that cannot execute off Linux.
          for t in help doctor up down clean restart status ps logs test chain; do
            echo "=== make -n $t ==="
            make -n "$t"
          done
          # The documented overrides must expand too.
          make -n logs SVC=keyvault-emulator
          make -n up PROFILE="--profile full"

      # status.sh's whole job is to REPORT that something is unreachable, so
      # the unreachable case is the one that has to be tested. It was broken:
      # `set -e` plus an assignment from a failing curl killed the script at
      # the first dead endpoint, and it exited with curl's status having named
      # nothing. That is not an OS-specific bug, so this runs everywhere --
      # it needs no containers, only a closed port.
      - name: status.sh reports an unreachable endpoint instead of dying on it
        shell: bash
        run: |
          # `if out=$(...)` rather than a bare assignment, for exactly the
          # reason this step exists. GitHub runs `shell: bash` as
          # `bash --noprofile --norc -e -o pipefail`, so -e is already on and
          # `set +e`/`set -uo pipefail` at the top of the script cannot be
          # relied on to express intent here. An assignment that fails would
          # kill the step before the first echo -- which is how this very step
          # failed on its first run, reproducing the defect under test.
          # Assignments inside an `if` condition are exempt from -e.
          if out=$(COMPOSE_PROJECT_NAME=no-such-project-for-this-test \
                   VAULT_URL=https://127.0.0.1:59999 \
                   ENTRA_URL=https://127.0.0.1:59999 \
                   sh scripts/status.sh 2>&1); then rc=0; else rc=$?; fi
          echo "$out"
          echo "exit=$rc"
          # 1 is "checks failed", which is the answer. curl's own codes (7
          # connection refused, 35 TLS) mean the script died mid-probe.
          [ "$rc" = 1 ] || { echo "::error::expected exit 1, got $rc — status.sh died instead of reporting"; exit 1; }
          # Both probes must be REACHED and reported, not just the first.
          grep -q 'FAIL  entra discovery .*HTTP ---' <<<"$out" || { echo "::error::entra probe not reported"; exit 1; }
          grep -q 'FAIL  vault /health .*HTTP ---'   <<<"$out" || { echo "::error::vault probe not reported — the script stopped early"; exit 1; }
          # And the sections after the probes must still run.
          grep -q '401 challenge' <<<"$out" || { echo "::error::challenge section never ran"; exit 1; }
          grep -q 'pair has problems' <<<"$out" || { echo "::error::summary never printed"; exit 1; }

      - name: make test
        shell: bash
        run: make test

      # The real thing, where a Linux container runtime exists.
      - name: make doctor
        if: runner.os == 'Linux'
        run: make doctor

      - name: make up / status / down
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          make up
          make status
          make down

      # Not `make logs`: that target follows (-f) and would hang the job.
      - name: Container logs on failure
        if: failure() && runner.os == 'Linux'
        run: docker compose logs --no-color --tail 200 || true
