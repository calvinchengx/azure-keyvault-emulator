name: Docs site

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'site/**'
      - 'scripts/build_landing_data.py'
      - 'scripts/assemble_site.py'
      - 'website/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'package.json'
      - '.github/workflows/docs-site.yml'
  # Pull requests build the site as a check: the docs generator shells out to
  # git for the parity versions, so a PR that breaks it should fail here rather
  # than after merge. Build only: the deploy job is skipped below.
  pull_request:
    paths:
      - 'docs/**'
      - 'site/**'
      - 'scripts/build_landing_data.py'
      - 'scripts/assemble_site.py'
      - 'website/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'package.json'
      - '.github/workflows/docs-site.yml'
  workflow_dispatch:

# Allow the deploy job to publish to GitHub Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# One publish at a time, newest wins.
#
# PR builds get their OWN group, per ref. They must not share the deploy group:
# GitHub keeps at most one PENDING run per concurrency group and cancels the
# older one when a newer arrives, so while runners are saturated a steady
# arrival of PR builds cancels the queued main-branch run over and over and the
# site never publishes. This repo demonstrated it: a Dependabot batch cancelled
# the deploys for two consecutive main pushes, with no error anywhere to say so
# — a cancelled run reads exactly like a harmless supersession.
#
# PR builds also cancel their own predecessors (only the newest matters).
#
# Deploys used to refuse to cancel a running publish. That looked safe and was
# the actual failure mode: a publish that never finishes holds the group
# forever, and the one-pending-run rule then cancels every main run queued
# behind it. Twice now. On 2026-08-08 run 31239784632 created a Pages
# deployment that never received a single status event, sat in `queued` for 35
# hours and starved twelve consecutive main runs while the live site went
# stale; on 2026-08-09 it recurred, stranding five more deployments (two
# `error`, two with no status at all). `timeout-minutes` does not save us here:
# it bounds execution, and these jobs never start executing.
#
# So deploys now supersede instead of queueing. On a docs site the newest
# commit is the one worth publishing, a superseded publish loses nothing, and
# every push becomes a chance to clear a stuck predecessor rather than another
# victim of it. The sibling emulators never hit this because they merge to main
# a few times a day; this repo did 12 docs-site runs in one day.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pages-pr-{0}', github.ref) || 'pages' }}
  # PR builds cancel their predecessors; only the newest matters. A main
  # DEPLOY must never be cancelled: it leaves the published site in
  # whatever state it reached, and a cancelled run reads as a harmless
  # supersession in the UI. The landing page merged at 13:49 and did not
  # appear, because the next push to main cancelled its deploy.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build Starlight site
    runs-on: ubuntu-latest
    # Starlight builds in ~30s; the coverage step below dominates. This only
    # fires if something hangs.
    timeout-minutes: 15
    steps:
      # Full history + tags: the parity-version generator reads the map at each
      # `v*` tag (git show) and stamps the live map from `git describe`.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter azure-keyvault-emulator-docs build
      # THE LANDING PAGE AT THE ROOT, THE DOCS UNDER /docs/, and a redirect
      # stub at every path the site published before the move. `/` is now the
      # project's front door and every chapter lives under `/docs/`, which is
      # the shape the rest of the family uses.
      #
      # Astro's `base` is `/azure-keyvault-emulator/docs/` for exactly this
      # layout. Change one without the other and Starlight still builds, but
      # every internal link resolves a directory too high.
      #
      # The assembler holds itself to website/published-routes.txt, the route
      # list captured from the build immediately before the base changed, so an
      # old URL that would 404 fails the deploy instead of reaching a reader.
      #
      # The self-test runs first: a gate nobody has watched fail is a gate
      # nobody knows the direction of.
      - name: Assemble the site, and prove no published URL moved
        run: |
          python3 scripts/assemble_site.py --self-test
          python3 scripts/assemble_site.py --out _site
      # The badge endpoints ride along with the site, so they are served from
      # this project's own origin rather than a coverage vendor. They stay at
      # the ROOT rather than moving under /docs/ with the Starlight output:
      # README.md's shields URLs name them there, and a badge that 404s renders
      # as "invalid" rather than as an error anyone chases.
      #
      # AFTER the assembler, which clears _site before it writes.
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Measure coverage and write the badge endpoints
        run: |
          go test -coverpkg=./... -coverprofile=cover.out ./... >/dev/null
          pct=$(go tool cover -func=cover.out | tail -1 | awk '{print $3}' | tr -d '%')
          echo "go coverage: ${pct}%"
          python3 scripts/coverage_badges.py --out _site --go "$pct"
      # The landing page carries no numbers, only placeholders. This derives
      # them from docs/parity.md and docs/witnesses.json, writes them beside
      # the page, and FAILS if the page has stopped being bound to either
      # manifest or has grown a headline number written by hand.
      #
      # AFTER assembly, because the assembled tree is what is served: a link
      # from the landing page into the docs is only resolvable once both halves
      # sit in one directory, and the docs' base path moved when they did,
      # which is the change that 404s silently if it is got wrong.
      - name: The landing page is bound to its manifests, and its links resolve
        run: python3 scripts/build_landing_data.py --out _site --site _site
      - uses: actions/upload-pages-artifact@v5
        if: github.event_name != 'pull_request'
        with:
          path: _site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    # PRs get the build as a check only. Deploying from a PR ref would be
    # rejected by the github-pages environment regardless.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    # The publish itself takes seconds. This bounds one that starts and then
    # hangs; a deployment that never starts is the supersede rule's job, since
    # timeout-minutes does not count time spent queued.
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
