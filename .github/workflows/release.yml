name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write # create the GitHub Release
  packages: write # push the image to GHCR

jobs:
  # Gate: the Makefile is what users are told to run, on all three platforms.
  # A release that publishes binaries whose documented entry point is broken on
  # Windows or macOS is worse than a late release. Nothing gated this workflow
  # before: a tag published straight to GHCR and the Releases page.
  make-targets:
    uses: ./.github/workflows/make-targets.yml

  binaries:
    name: Cross-platform binaries (GoReleaser)
    needs: make-targets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # GoReleaser needs full history/tags
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      # GoReleaser's skip_upload guard skips a publisher when its token is unset.
      # A fork needs that. On this repo the same silence is a bug: this repo and
      # its sibling both released for weeks with a green workflow and no cask in
      # calvinchengx/homebrew-tap, because a missing secret and a fork look
      # identical to that guard. So enumerate the states that are fine, refuse
      # the rest, and print what was actually seen. Forks keep the old behaviour.
      #
      # This runs BEFORE GoReleaser on purpose: a failure here publishes nothing,
      # so the fix is add-the-secret and re-run, not a half-published release.
      - name: Publish tokens are present (canonical repo only)
        if: github.repository_owner == 'calvinchengx'
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
        run: |
          set -euo pipefail
          missing=""
          if [ -n "${HOMEBREW_TAP_TOKEN:-}" ]; then
            echo "  set      HOMEBREW_TAP_TOKEN"
          else
            echo "  MISSING  HOMEBREW_TAP_TOKEN  (homebrew_casks would be skipped)"
            missing="${missing} HOMEBREW_TAP_TOKEN"
          fi
          if [ -n "${WINGET_TOKEN:-}" ]; then
            echo "  set      WINGET_TOKEN"
          else
            echo "  MISSING  WINGET_TOKEN  (winget would be skipped)"
            missing="${missing} WINGET_TOKEN"
          fi
          if [ -n "${missing}" ]; then
            echo "::error::Unset publish secret(s):${missing}. GoReleaser skips those publishers and still exits 0, so this release would look green while publishing nothing. Add the secret, or delete that publisher from .goreleaser.yaml to opt out deliberately."
            exit 1
          fi
      - uses: goreleaser/goreleaser-action@v7
        with:
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Write access to calvinchengx/homebrew-tap so GoReleaser can commit
          # the cask. Optional: if the secret is unset the homebrew_casks step
          # self-skips (skip_upload) instead of failing the release.
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          # Write access to a calvinchengx/winget-pkgs fork so GoReleaser can
          # open the manifest PR against microsoft/winget-pkgs. Optional: if the
          # secret is unset the winget step self-skips (skip_upload).
          WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}

  image:
    name: Docker image to GHCR
    needs: make-targets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=${{ github.ref_name }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
