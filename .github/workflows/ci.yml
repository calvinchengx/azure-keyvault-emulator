name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Build, vet & tests (incl. real Azure SDK e2e vs entra-emulator)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: '1.25'
      - run: go vet ./...
      - run: go build ./...
      # The server tests start a real entra-emulator in-process; azsecrets +
      # azidentity complete challenge-based auth against it for real.
      - run: go test -coverpkg=./... -coverprofile=cover.out ./...
      - name: Coverage floor (90%)
        run: |
          total=$(go tool cover -func=cover.out | tail -1 | awk '{print $3}' | tr -d '%')
          echo "total coverage: ${total}%"
          awk -v t="$total" 'BEGIN { exit (t < 90) ? 1 : 0 }'

  portal:
    name: Portal builds from source
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter azure-keyvault-emulator-portal test
      - run: pnpm --filter azure-keyvault-emulator-portal build
      # portal/dist is committed (go:embed bakes it into the binary so `go build`
      # / `go install @latest` need no Node). Fail if the committed copy has
      # drifted from a fresh build so it can never go stale.
      - name: Verify committed portal/dist is up to date
        run: |
          changes="$(git status --porcelain -- portal/dist)"
          if [ -n "$changes" ]; then
            echo "::error::portal/dist is stale. Run 'pnpm --filter azure-keyvault-emulator-portal build' and commit portal/dist."
            echo "$changes"
            exit 1
          fi
      # Headless mount smoke: a bundle can build and pass jsdom unit tests yet
      # never mount in a real browser (server-build resolution). Assert the
      # built dist actually renders.
      - run: pnpm --filter azure-keyvault-emulator-portal exec playwright install --with-deps chromium
      - run: pnpm --filter azure-keyvault-emulator-portal smoke

  chain:
    name: Three-emulator secret-as-SP-credential chain
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: '1.25'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      # Installs entra + fabric (go install), builds this emulator, and walks
      # vault secret -> managed identity -> entra token -> fabric: three real
      # processes, all on the production trust relationships.
      - run: python3 e2e/chain/run.py

  python-sdk:
    name: Real Python SDK (azure-keyvault-*) against the emulator pair
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: '1.25'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.32"
      # Pinned azure-identity + azure-keyvault-{secrets,keys,certificates}
      # complete challenge auth against a real entra-emulator, then exercise
      # secrets (incl. soft-delete -> recover -> purge), RSA crypto through
      # CryptographyClient, and the self-signed certificate LRO.
      - run: python e2e/sdk/run.py python

  js-sdk:
    name: Real JavaScript SDK (@azure/keyvault-*) against the emulator pair
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: '1.25'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Same surface as the python suite, driven by the pinned @azure/identity
      # + @azure/keyvault-{secrets,keys,certificates} packages.
      - run: python e2e/sdk/run.py js

  dotnet-sdk:
    name: Real .NET SDK (Azure.Security.KeyVault.*) against the emulator pair
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: '1.25'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      # GitHub-hosted runners ship the .NET 8 SDK on all three OSes; the suite
      # targets net8.0 with pinned Azure.Identity + Azure.Security.KeyVault.*.
      - run: python e2e/sdk/run.py dotnet

  witnesses:
    name: Every green parity claim names its witness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Strict: every claim is mapped, so a new green row without a witness
      # (or a witness that no longer exists) fails the build. That second case
      # is the valuable one: it catches a test being renamed or deleted out
      # from under the claim that depended on it.
      #
      # --no-project because this repo has no Python project; the checker is
      # stdlib-only. uv still supplies the interpreter, so the version is pinned
      # rather than whatever the runner happens to ship.
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.32"
      - run: uv run --no-project --python 3.12 python scripts/check_witnesses.py --strict
