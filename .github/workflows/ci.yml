name: CI

on:
  push:
    branches: [main]
  pull_request:

# Every job here only reads the checkout; nothing writes through GITHUB_TOKEN.
permissions:
  contents: read

jobs:
  # THE DOCS LANE, ON PULL REQUESTS ONLY. Jobs that cannot observe a markdown
  # file are gated on `docs_only != 'true'`; the jobs that READ the docs are
  # not, because they must run on exactly those changes. A push to main always
  # runs everything, whatever it touched -- see the classify step below.
  # See scripts/docs_only_change.py.
  #
  # Ported from fabric-emulator, which worked this out first.
  changes:
    name: Is this change documentation only?
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      docs_only: ${{ steps.classify.outputs.docs_only }}
    steps:
      # Full history: the classifier diffs against the base, which a depth-1
      # checkout cannot see.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # Beside the real classification, every time. A classifier that stopped
      # matching would answer `false` forever: safe, plausible, and silently
      # useless. The cases are the only thing that would notice.
      - run: python3 scripts/docs_only_change.py --self-test
      - id: classify
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          # A force push and a branch's first commit both give the null sha.
          # Neither is a docs change; both run everything.
          # THE LANE IS FOR PULL REQUESTS. EVERY COMMIT ON MAIN GETS THE
          # FULL MATRIX, whatever it touched.
          #
          # This was not the original rule, and the original rule was wrong.
          # A docs-only commit on main took the cheap lane and reported CI
          # SUCCESS having run a handful of jobs, so main's tip carried a
          # verdict no full run had produced. Each such green is locally true
          # -- a markdown file cannot break a Go test -- and that is exactly
          # what makes it dangerous: the commit is green and the branch's
          # state is unknown. fabric-emulator found this the expensive way,
          # with four tests broken under a green main for two days and two
          # open pull requests inheriting a red baseline nobody knew about.
          #
          # Realised twice here, on main:
          #   9093f59 'A family footer: the other ten documentation sites.' (#73)
          #   2adee01 'A way back from the docs to the landing page.' (#71)
          # Both ran 12 jobs where a full run is 18.
          #
          # Every commit on main is shipped, and each is what a bisect will
          # later ask about. A carried-forward verdict is not a verdict.
          #
          # The saving that matters is kept: iteration happens on the pull
          # request, where a docs change still runs a couple of jobs instead
          # of the whole matrix. Merging it costs one full run, once.
          if [ "${GITHUB_EVENT_NAME}" != "pull_request" ]; then
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            echo "event is ${GITHUB_EVENT_NAME}, not a pull request: every commit on main gets the full matrix"
            exit 0
          fi
          if ! git rev-parse -q --verify "$BASE^{commit}" >/dev/null; then
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            echo "base '$BASE' is not a commit here; running everything"
            exit 0
          fi
          git diff --name-status "$BASE...$HEAD_SHA" | python3 scripts/docs_only_change.py

  test:
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    name: Build, vet & tests (incl. real Azure SDK e2e vs entra-emulator)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      # Naming the files matters: `test -z "$(gofmt -l .)"` fails with no
      # output at all, so the one check whose entire job is "which file" tells
      # you nothing and you reproduce it locally to find out.
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt would change these files:"
            echo "$unformatted"
            exit 1
          fi
      - run: go vet ./...
      - run: go build ./...
      # The server tests start a real entra-emulator in-process; azsecrets +
      # azidentity complete challenge-based auth against it for real.
      - run: go test -coverpkg=./... -coverprofile=cover.out ./...
      - name: Coverage floor (90%)
        run: |
          total=$(go tool cover -func=cover.out | tail -1 | awk '{print $3}' | tr -d '%')
          echo "total coverage: ${total}%"
          awk -v t="$total" 'BEGIN { exit (t < 90) ? 1 : 0 }'

  portal:
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    name: Portal builds from source
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter azure-keyvault-emulator-portal test
      - run: pnpm --filter azure-keyvault-emulator-portal build
      # portal/dist is committed (go:embed bakes it into the binary so `go build`
      # / `go install @latest` need no Node). Fail if the committed copy has
      # drifted from a fresh build so it can never go stale.
      - name: Verify committed portal/dist is up to date
        run: |
          changes="$(git status --porcelain -- portal/dist)"
          if [ -n "$changes" ]; then
            echo "::error::portal/dist is stale. Run 'pnpm --filter azure-keyvault-emulator-portal build' and commit portal/dist."
            echo "$changes"
            exit 1
          fi
      # Headless mount smoke: a bundle can build and pass jsdom unit tests yet
      # never mount in a real browser (server-build resolution). Assert the
      # built dist actually renders.
      - run: pnpm --filter azure-keyvault-emulator-portal exec playwright install --with-deps chromium
      - run: pnpm --filter azure-keyvault-emulator-portal smoke

  chain:
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    name: Three-emulator secret-as-SP-credential chain
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      # Installs entra + fabric (go install), builds this emulator, and walks
      # vault secret -> managed identity -> entra token -> fabric: three real
      # processes, all on the production trust relationships.
      - run: python3 e2e/chain/run.py

  arm-chain:
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    name: ARM role assignment governs the data plane
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      # Three real processes: entra mints an ARM token, arm-emulator takes a
      # role assignment over ARM's real wire, and this emulator's data plane
      # flips from 403 to authorized because of it — then back on revocation,
      # and again via a classic access policy.
      - run: python e2e/arm-chain/run.py

  az-cli:
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    name: The real az CLI drives the family as a registered cloud
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      # GitHub-hosted runners ship the Azure CLI. The harness registers the
      # emulator family with `az cloud register` (the sovereign-cloud path),
      # logs in against entra-emulator, then creates a resource group, a
      # vault, a role assignment and an access policy — and asserts the vault
      # data plane flips between 403 and authorized because of them.
      - run: az version
      - run: python e2e/az-cli/run.py

  python-sdk:
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    name: Real Python SDK (azure-keyvault-*) against the emulator pair
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.11.32"
      # Pinned azure-identity + azure-keyvault-{secrets,keys,certificates}
      # complete challenge auth against a real entra-emulator, then exercise
      # secrets (incl. soft-delete -> recover -> purge), RSA crypto through
      # CryptographyClient, and the self-signed certificate LRO.
      - run: python e2e/sdk/run.py python

  host-routed:
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    name: Real SDK at {name}.vault.azure.net, checks ON
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Everything runs in compose: the vault answers to a network ALIAS, which
      # is what lets the SDK keep verify_challenge_resource on. The vault image
      # is built from this checkout, not pulled.
      - run: python3 e2e/host-routed/run.py

  js-sdk:
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    name: Real JavaScript SDK (@azure/keyvault-*) against the emulator pair
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Same surface as the python suite, driven by the pinned @azure/identity
      # + @azure/keyvault-{secrets,keys,certificates} packages.
      - run: python e2e/sdk/run.py js

  dotnet-sdk:
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    name: Real .NET SDK (Azure.Security.KeyVault.*) against the emulator pair
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      # GitHub-hosted runners ship the .NET 8 SDK on all three OSes; the suite
      # targets net8.0 with pinned Azure.Identity + Azure.Security.KeyVault.*.
      - run: python e2e/sdk/run.py dotnet

  witnesses:
    name: Every green parity claim names its witness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Strict: every claim is mapped, so a new green row without a witness
      # (or a witness that no longer exists) fails the build. That second case
      # is the valuable one: it catches a test being renamed or deleted out
      # from under the claim that depended on it.
      #
      # --no-project because this repo has no Python project; the checker is
      # stdlib-only. uv still supplies the interpreter, so the version is pinned
      # rather than whatever the runner happens to ship.
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.11.32"
      - run: uv run --no-project --python 3.12 python scripts/check_witnesses.py --strict
      # The site build does NOT catch a dangling intra-doc link: measured, it
      # exits 0 and publishes a 404. Nor can it see a page missing from the
      # sidebar, which is published but unreachable by navigation.
      - run: uv run --no-project --python 3.12 python scripts/check_docs_links.py --strict

  lint:
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    name: golangci-lint
    runs-on: ubuntu-latest
    # A wedged run must fail rather than sit in GitHub's 6-hour default, where
    # 'pending' and 'stuck' look identical.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      # Gated at zero. .golangci.yml excludes unchecked Close, Rollback and
      # writes to a response, where the return value is unactionable at the
      # call site; everything surviving that is fixed rather than suppressed.
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2
