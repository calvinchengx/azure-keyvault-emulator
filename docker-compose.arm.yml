# ARM overlay: put the management plane in charge of this vault.
#
#   docker compose -f docker-compose.yml -f docker-compose.arm.yml up
#   make up ARM=1
#
# Without it the vault answers to its own /_emulator control surface, which is
# what the quickstart and the unit tests use. With it, authorization and the
# vault's configuration come from where Azure keeps them — role assignments and
# the Microsoft.KeyVault/vaults resource — so `az role assignment create` and
# `az keyvault update --enable-purge-protection` govern the running emulator.
#
# Version skew is safe in one direction: an arm older than the vault-config
# feed simply omits the `vault` block, and this emulator then keeps its own
# settings rather than being reconfigured by a field that is not there. Pin
# ARM_IMAGE_TAG when you need a specific peer.
#
# It is an overlay rather than a service in the base file so that the base file
# depends only on images this repo and entra publish. Folding arm in made
# `make up` pull ghcr.io/calvinchengx/arm-emulator before that image existed,
# which is a bootstrap deadlock: keyvault CI could not go green until arm cut a
# release, and arm's release gate runs `make up`.
services:
  # The management plane: role assignments and the vault resource live here,
  # exactly as they do in Azure.
  arm-emulator:
    # ARM_IMAGE_TAG, not ARM_VERSION: the e2e harnesses use ARM_VERSION for the
    # Go module version (`v0.1.1`), while the image tag drops the v (`0.1.1`).
    # Sharing one name would silently resolve to a tag that does not exist.
    image: ghcr.io/calvinchengx/arm-emulator:${ARM_IMAGE_TAG:-latest}
    depends_on:
      entra-emulator:
        condition: service_healthy
    ports:
      - "${ARM_PORT:-8445}:8445"
    environment:
      ARM_ENTRA_ISSUER: "https://entra-emulator:8443/11111111-1111-1111-1111-111111111111/v2.0"
      ARM_ENTRA_TLS_INSECURE: "true"
      ARM_TENANT_ID: "11111111-1111-1111-1111-111111111111"
      ARM_DATA_DIR: ""
    healthcheck:
      test: ["CMD", "/usr/local/bin/arm-emulator", "healthcheck"]
      interval: 5s
      timeout: 2s
      retries: 10

  # Compose merges these into the base definition: the extra dependency and
  # the two variables that hand authorization over to ARM.
  keyvault-emulator:
    depends_on:
      entra-emulator:
        condition: service_healthy
      arm-emulator:
        condition: service_healthy
    environment:
      # Role assignments and the vault resource's own configuration (access
      # policies, RBAC mode, purge protection, the soft-delete window) are
      # polled from here. An absent vault resource changes nothing.
      KV_ARM_URL: "https://arm-emulator:8445"
      KV_ARM_RESOURCE_GROUP: "emulator-rg"
